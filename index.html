<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter For You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background container for floating emojis -->
    <div class="emoji-bg" id="emojiBg"></div>

    <!-- The Envelope -->
    <div class="envelope-wrapper" id="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-front"></div>
        <div class="heart-seal">❤️</div>
        
        <!-- The Letter Inside -->
        <div class="letter">
            <h1>Hey boo... ❤️</h1>
            <p>You crossed my mind today, Hope you're doing good.🐘</p>
            <p class="cute-note">Ngl, I've been missing you. 🥺🎱</p>
            <p>Wish you were here watching Everybody Hates Chris with me.❤️🎱</p>
        </div>

        <!-- Interactive Hint -->
        <div class="hint" id="hintText">Click to open your letter! 💌</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
